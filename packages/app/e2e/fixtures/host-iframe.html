<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Handover host (iframe)</title>
  </head>
  <body>
    <h1>Handover host (iframe)</h1>
    <!-- The documented sandbox configuration: allow-same-origin keeps the
         origin intact so postMessage trust checks work. -->
    <iframe
      id="exp"
      src="/explorer"
      sandbox="allow-scripts allow-same-origin"
      style="width: 1100px; height: 700px; border: 1px solid #999"
    ></iframe>
    <pre id="log">[]</pre>
    <script>
      // Well-behaved iframe parent: validates origin AND source.
      const log = []
      const frame = document.getElementById('exp')
      let frameWin = null
      window.addEventListener('message', (event) => {
        if (!event.data || event.data.ns !== 'jsonl-explorer') return
        if (event.origin !== location.origin) return
        if (event.source !== frameWin) return
        log.push({ type: event.data.type, lines: event.data.lines })
        document.getElementById('log').textContent = JSON.stringify(log)
        if (event.data.type === 'ready') {
          frameWin.postMessage(
            {
              ns: 'jsonl-explorer',
              v: 1,
              type: 'load',
              name: 'frame.jsonl',
              payload: '{"x":1}\n{"y":2}\n{"z":3}\n',
            },
            location.origin,
          )
        }
      })
      frame.addEventListener('load', () => {
        frameWin = frame.contentWindow
      })
    </script>
  </body>
</html>
