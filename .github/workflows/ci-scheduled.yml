name: CI (scheduled / manual — full browser matrix)

# The PR workflow (ci.yml) stays fast: unit + build + Chromium E2E. This
# workflow adds the WebKit SMOKE subset (playwright project 'webkit',
# enabled via E2E_INCLUDE_WEBKIT) on a weekly schedule and on demand.

on:
  schedule:
    # Monday 03:17 UTC — off-peak, away from dependency-update bursts.
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write

concurrency:
  group: scheduled-full-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.11.0'
  PNPM_VERSION: '9.4.0'

jobs:
  full-suite:
    name: Unit + Build + E2E (Chromium & WebKit smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (app + shared + cli, incl. packed-artifact suite)
        run: pnpm test:unit

      - name: Build app and CLI
        run: pnpm build

      - name: Install Chromium + WebKit
        run: pnpm --filter jsonl-explorer-app exec playwright install --with-deps chromium webkit

      - name: Run E2E (Chromium full + WebKit smoke)
        env:
          E2E_INCLUDE_WEBKIT: '1'
        run: pnpm test:e2e

      - name: Upload E2E artifacts (traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-scheduled
          path: packages/app/test-results/
          retention-days: 14
